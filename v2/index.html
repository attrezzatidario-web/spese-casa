<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spese Casa</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; background: #f6f6f4; color: #16191d; padding: 24px; box-sizing: border-box; }
  @media (prefers-color-scheme: dark) { body { background: #111312; color: #eef0ee; } .card { background: #1b1e1d !important; } p { color: #a9b0ad !important; } }
  .card { max-width: 380px; background: #fff; border-radius: 20px; padding: 28px 24px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.06); }
  h1 { font-size: 22px; margin: 14px 0 8px; }
  p { color: #5d6670; margin: 0 0 18px; font-size: 15px; }
  a.btn { display: block; background: #1a7a5e; color: #fff; text-decoration: none; padding: 14px; border-radius: 12px; font-weight: 600; }
  small { display: block; margin-top: 14px; color: #8a929b; font-size: 13px; }
</style>
</head>
<body>
  <div class="card">
    <img src="logo.svg" alt="" width="64" height="64">
    <h1>Spese Casa si è spostata</h1>
    <p>La nuova versione ora è all'indirizzo principale. I tuoi dati sono già lì.</p>
    <a class="btn" href="../">Apri Spese Casa</a>
    <small>Se avevi l'icona "Spese Casa 2" sulla schermata Home, eliminala e aggiungi quella nuova dall'indirizzo principale.</small>
  </div>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => { if (r.scope.endsWith('/v2/')) r.update().catch(() => {}); })).catch(() => {});
  </script>
</body>
</html>
