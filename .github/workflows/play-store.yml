name: App per Google Play

# Si avvia a mano: GitHub > Actions > "App per Google Play" > Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aab:
    runs-on: ubuntu-latest
    env:
      SC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Controllo password
        run: |
          # toglie spazi e "a capo" finiti per sbaglio nel segreto (copia e incolla)
          P=$(printf %s "$SC_KEY_PASSWORD" | tr -d ' \r\n\t')
          echo "::add-mask::$P"
          if [ ${#P} -lt 20 ]; then echo "::error::Manca il segreto ANDROID_KEY_PASSWORD (almeno 20 caratteri)"; exit 1; fi
          { echo "SC_KEY_PASSWORD<<SCEOF"; echo "$P"; echo "SCEOF"; } >> "$GITHUB_ENV"
      - name: Chiave di caricamento (creata la prima volta, poi riusata)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          trap 'echo "::error::Errore al passo: $BASH_COMMAND"' ERR
          set -e
          mkdir -p "$RUNNER_TEMP/k"
          gh release view play-key >/dev/null 2>&1 || gh release create play-key --title "Chiave di caricamento (cifrata)" --notes "File cifrato: senza la password ANDROID_KEY_PASSWORD non serve a niente." --prerelease
          if gh release download play-key -p upload-key.enc -D "$RUNNER_TEMP/k" 2>/dev/null; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$RUNNER_TEMP/k/upload-key.enc" -out "$RUNNER_TEMP/k/upload.jks" -pass env:SC_KEY_PASSWORD
            echo "Chiave esistente riusata"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/k/upload.jks" -storetype PKCS12 -alias upload -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass:env SC_KEY_PASSWORD -keypass:env SC_KEY_PASSWORD -dname "CN=Tetto Studio, O=Tetto Studio, C=IT"
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "$RUNNER_TEMP/k/upload.jks" -out "$RUNNER_TEMP/k/upload-key.enc" -pass env:SC_KEY_PASSWORD
            gh release upload play-key "$RUNNER_TEMP/k/upload-key.enc"
            echo "Nuova chiave creata e salvata cifrata"
          fi
          echo "SC_KEYSTORE=$RUNNER_TEMP/k/upload.jks" >> "$GITHUB_ENV"
          echo "SC_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "SC_VERSION_NAME=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Dipendenze e app web
        working-directory: nativa
        run: npm ci && node scripts/copia-web.mjs && npx cap sync android
      - name: Compila il pacchetto per Google Play (.aab)
        working-directory: nativa/android
        run: chmod +x gradlew && ./gradlew bundleRelease --no-daemon
      - name: Pubblica il file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp nativa/android/app/build/outputs/bundle/release/app-release.aab "spese-casa-$SC_VERSION_NAME.aab"
          gh release view play-store >/dev/null 2>&1 || gh release create play-store --title "Spese Casa · file per Google Play" --notes "Pacchetto firmato da caricare in Play Console." --prerelease
          gh release upload play-store "spese-casa-$SC_VERSION_NAME.aab" --clobber
          rm -f "$SC_KEYSTORE"
