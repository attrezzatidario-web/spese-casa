name: App Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app.js', 'ai.js', 'index.html', 'style.css', 'nativa/**', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nativa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Dipendenze
        run: npm ci
      - name: Copia app web e sincronizza
        run: node scripts/copia-web.mjs && npx cap sync android
      - name: Compila APK di prova
        working-directory: nativa/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: spese-casa-android-prova
          path: nativa/android/app/build/outputs/apk/debug/app-debug.apk
