name: App Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app.js', 'ai.js', 'index.html', 'style.css', 'nativa/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nativa
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Dipendenze
        run: npm ci
      - name: Copia app web e sincronizza
        run: node scripts/copia-web.mjs && npx cap sync android
      - name: Compila APK di prova
        working-directory: nativa/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Pubblica l'APK di prova (link fisso)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp nativa/android/app/build/outputs/apk/debug/app-debug.apk spese-casa.apk
          gh release view android-prova >/dev/null 2>&1 || gh release create android-prova --title "Spese Casa · Android di prova" --notes "Versione di prova da installare a mano su Android. Si aggiorna da sola a ogni modifica." --prerelease
          gh release upload android-prova spese-casa.apk --clobber
